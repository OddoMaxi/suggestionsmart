services:
  - type: web
    name: smartsuggest-qr
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeploy: true

    envVars:
      - key: APP_NAME
        value: "SmartSuggest QR"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false

      # Base de données — à renseigner manuellement après déploiement
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

      - key: MAIL_MAILER
        value: log
      - key: MAIL_FROM_ADDRESS
        value: noreply@smartsuggest.app
      - key: MAIL_FROM_NAME
        value: "SmartSuggest QR"

      - key: APP_TIMEZONE
        value: Africa/Conakry
      - key: APP_LOCALE
        value: fr
