services:
  app:
    build: .
    restart: always
    ports:
      - "80:80"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage_qrcodes:/app/storage/app/public/qrcodes
      - storage_logs:/app/storage/logs

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  storage_qrcodes:
  storage_logs:
